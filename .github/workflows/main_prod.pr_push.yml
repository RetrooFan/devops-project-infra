name: "Terraform"

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main, prod]

permissions:
  contents: read
  id-token: write

jobs:
  aws:
    runs-on: ubuntu-latest
    environment: >-
      ${{ ((github.event_name == 'pull_request' && github.base_ref == 'prod') ||
          (github.event_name == 'push' && github.ref_name == 'prod')) &&
          'prod' || 'staging' }}
    strategy:
      matrix:
        terraform-directory: [aws/backend, aws/infra]
    env:
      AWS_REGION: eu-central-1

    steps:
      - name: Show vars.ENVIRONMENT
        run: echo ${{ vars.ENVIRONMENT }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure 'backend.tf' file
        working-directory: ${{ matrix.terraform-directory }}
        run: |
          cp backend.tf.example backend.tf
          sed -i 's/"bucket"/"${{ secrets.TERRAFORM_BUCKET_NAME }}"/g' backend.tf
          sed -i 's/"region"/"${{ env.AWS_REGION }}"/g' backend.tf

      - name: Configure 'terraform.tfvars' file
        working-directory: ${{ matrix.terraform-directory }}
        run: |
          cp terraform.tfvars.example terraform.tfvars
          sed -i 's/"region"/"${{ env.AWS_REGION }}"/g' terraform.tfvars
          sed -i 's/"bucket_name"/"${{ secrets.TERRAFORM_BUCKET_NAME }}"/g' terraform.tfvars
          sed -i 's/"repository_name"/"${{ vars.TERRAFORM_REPOSITORY_NAME }}"/g' terraform.tfvars
          sed -i 's/"github_org"/"${{ secrets.TERRAFORM_GITHUB_ORG }}"/g' terraform.tfvars
          sed -i 's/"github_repo"/"${{ secrets.TERRAFORM_GITHUB_REPO }}"/g' terraform.tfvars
          sed -i 's/"github_repo2"/"${{ secrets.TERRAFORM_GITHUB_REPO2 }}"/g' terraform.tfvars
          sed -i 's/"github_env"/"${{ secrets.TERRAFORM_GITHUB_ENV }}"/g' terraform.tfvars

      - name: Configure 'github_oidc.tf' file
        working-directory: ${{ matrix.terraform-directory }}/iam
        if: matrix.terraform-directory == 'aws/backend' && vars.ENVIRONMENT == 2
        run: cp github_oidc.tf.example github_oidc.tf

      - name: Terraform Format
        working-directory: ${{ matrix.terraform-directory }}
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ${{ matrix.terraform-directory }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ${{ matrix.terraform-directory }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ matrix.terraform-directory }}
        if: github.event_name == 'push'
        run: terraform apply -auto-approve -input=false tfplan
